<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VRUM — Làn gió mới của diễn đàn Việt. Nơi kết nối, chia sẻ và tạo nên những cuộc trò chuyện đáng giá." />
    <meta name="theme-color" content="#f4f4f4" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('vrum-theme');
          const preference = ['light', 'dark', 'system'].includes(saved) ? saved : 'system';
          const theme = preference === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : preference;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#090909' : '#f4f4f4';
        } catch {
          const theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#090909' : '#f4f4f4';
        }
      })();
    </script>
    <title>VRUM — The Fresh Air of VN Forums</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
